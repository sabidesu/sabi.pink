---
title: blog
subtitle: a place for my thoughts and musings
layout: layouts/base.njk
---

{% for post in collections.blog | reverse %}
<h3>
  <a href="{{ post.url }}">{{ post.data.title }}</a>
</h3>
<p>
  {{ post.data.date.toLocaleDateString('en-US', { day: 'numeric', year:
  'numeric', month: 'short' }) | lower }}
</p>
{% endfor %}
